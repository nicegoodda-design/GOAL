<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AgriPass - 京大農学部合格特化型学習管理アプリ</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* iOSのSafariでの底面セーフエリア対策 */
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 1rem);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-20">

  <!-- アプリ本体コンテナ -->
  <div id="app"></div>

  <!-- React & React-DOM CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <!-- React Component JavaScript -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- 初期定数・設定 ---
    const TARGET_EXAM_DATE = '2028-02-25';
    const WEEKLY_GOAL_HOURS = 45;

    const DEFAULT_SUBJECTS = [

      { id: 'english', name: '英語', color: '#db2777' },

      { id: 'phys', name: '物理', color: '#0284c7' },
      { id: 'japanese', name: '国語 (現代文・古文・漢文)', color: '#d97706' },
      { id: 'common_test', name: '共通テスト対策 (社会等)', color: '#9333ea' },
    ];

    const DEFAULT_TEXTBOOKS = [
      // 英語
      { id: 'tb-eng-1', subjectId: 'english', name: 'Stock4500' },
      { id: 'tb-eng-2', subjectId: 'english', name: 'ランク順入試英熟語1100' },
      { id: 'tb-eng-3', subjectId: 'english', name: '速読英単語 上級編' },
      { id: 'tb-eng-4', subjectId: 'english', name: '関正生の英文法ポラリス1 標準レベル' },
      { id: 'tb-eng-5', subjectId: 'english', name: '大学入試世界一わかりやすい英文読解の特別講座' },
      { id: 'tb-eng-6', subjectId: 'english', name: '大学受験のための英文熟考 上' },
      { id: 'tb-eng-7', subjectId: 'english', name: '大学受験のための英文熟考 下' },
      { id: 'tb-eng-8', subjectId: 'english', name: 'やっておきたい英語長文300' },
      { id: 'tb-eng-9', subjectId: 'english', name: 'やっておきたい英語長文500' },
      { id: 'tb-eng-10', subjectId: 'english', name: '関正生のThe Rules 英語長文問題集1 入試基礎' },
      { id: 'tb-eng-11', subjectId: 'english', name: '関正生のThe Rules 英語長文問題集2 入試標準' },
      { id: 'tb-eng-12', subjectId: 'english', name: '関正生のThe Rules 英語長文問題集3 入試難関' },
      { id: 'tb-eng-13', subjectId: 'english', name: '関正生のThe Rules 英語長文問題集4 入試最難関' },
      { id: 'tb-eng-14', subjectId: 'english', name: '関正生の英語長文ポラリス1 標準レベル' },
      { id: 'tb-eng-15', subjectId: 'english', name: '関正生の英語長文ポラリス2 応用レベル' },
      { id: 'tb-eng-16', subjectId: 'english', name: '関正生の英語長文ポラリス3 発展レベル' },
      { id: 'tb-eng-17', subjectId: 'english', name: '英語長文問題精選ファイナル' },
      { id: 'tb-eng-18', subjectId: 'english', name: '国公立標準問題集CanPass 英語' },
      { id: 'tb-eng-19', subjectId: 'english', name: '大学入試英語長文プラス記述式トレーニング問題集' },
      { id: 'tb-eng-20', subjectId: 'english', name: '竹岡広信の英作文が面白いほど書ける本 決定版' },

      // 数学
      { id: 'tb-math-1', subjectId: 'math', name: '数学I・A 入門問題精講' },
      { id: 'tb-math-2', subjectId: 'math', name: '数学II・B 入門問題精講' },
      { id: 'tb-math-3', subjectId: 'math', name: '数学III・C 入門問題精講' },
      { id: 'tb-math-4', subjectId: 'math', name: 'Focus Gold 数学I+A' },
      { id: 'tb-math-5', subjectId: 'math', name: 'Focus Gold 数学II+B' },
      { id: 'tb-math-6', subjectId: 'math', name: 'Focus Gold 数学III' },
      { id: 'tb-math-7', subjectId: 'math', name: '1対1対応の演習／数学I' },
      { id: 'tb-math-8', subjectId: 'math', name: '1対1対応の演習／数学A' },
      { id: 'tb-math-9', subjectId: 'math', name: '1対1対応の演習／数学II' },
      { id: 'tb-math-10', subjectId: 'math', name: '1対1対応の演習／数学B' },
      { id: 'tb-math-11', subjectId: 'math', name: '1対1対応の演習／数学III 微積分編' },
      { id: 'tb-math-12', subjectId: 'math', name: '1対1対応の演習／数学III 曲線・複素数編' },
      { id: 'tb-math-13', subjectId: 'math', name: '数学I+A+II+B 上級問題精講' },
      { id: 'tb-math-14', subjectId: 'math', name: '数学III 上級問題精講' },

      // 化学
      { id: 'tb-chem-1', subjectId: 'chem', name: 'スクエア最新図説化学' },
      { id: 'tb-chem-2', subjectId: 'chem', name: '橋爪のゼロから劇的にわかる理論化学' },
      { id: 'tb-chem-3', subjectId: 'chem', name: '橋爪のゼロから劇的にわかる無機化学 有機化学' },
      { id: 'tb-chem-4', subjectId: 'chem', name: '化学の新標準演習' },
      { id: 'tb-chem-5', subjectId: 'chem', name: '鎌田の理論化学の講義' },
      { id: 'tb-chem-6', subjectId: 'chem', name: '福間の無機化学の講義' },
      { id: 'tb-chem-7', subjectId: 'chem', name: '鎌田の有機化学の講義' },
      { id: 'tb-chem-8', subjectId: 'chem', name: 'ここで差がつく有機化合物の構造決定問題の要点・演習' },
      { id: 'tb-chem-9', subjectId: 'chem', name: '化学重要問題集' },

      // 物理
      { id: 'tb-phys-1', subjectId: 'phys', name: 'スタサプ物理' },
      { id: 'tb-phys-2', subjectId: 'phys', name: '物理教室' },
      { id: 'tb-phys-3', subjectId: 'phys', name: '良問の風 物理頻出・標準入試問題集' },
      { id: 'tb-phys-4', subjectId: 'phys', name: '名問の森 物理［力学・熱・波動I］' },
      { id: 'tb-phys-5', subjectId: 'phys', name: '名問の森 物理［波動II・電磁気・原子］' },

      // 国語
      { id: 'tb-jp-1', subjectId: 'japanese', name: '読解を深める現代文単語 評論・小説' },
      { id: 'tb-jp-2', subjectId: 'japanese', name: 'マドンナ古文常識' },
      { id: 'tb-jp-3', subjectId: 'japanese', name: '古文単語グループ600' },
      { id: 'tb-jp-4', subjectId: 'japanese', name: '船口のゼロから読み解く最強の現代文' },
      { id: 'tb-jp-5', subjectId: 'japanese', name: '船口の記述トレーニング' },
      { id: 'tb-jp-6', subjectId: 'japanese', name: '現代文基礎問題精講' },
      { id: 'tb-jp-7', subjectId: 'japanese', name: '入試現代文へのアクセス 基本編' },
      { id: 'tb-jp-8', subjectId: 'japanese', name: '入試現代文へのアクセス 発展編' },
      { id: 'tb-jp-9', subjectId: 'japanese', name: '現代文読解力の開発講座' },
      { id: 'tb-jp-10', subjectId: 'japanese', name: '現代文と格闘する' },
      { id: 'tb-jp-11', subjectId: 'japanese', name: '八澤のたった6時間で古典文法' },
      { id: 'tb-jp-12', subjectId: 'japanese', name: '八澤のたった3時間で古文読解' },
      { id: 'tb-jp-13', subjectId: 'japanese', name: '古文上達 基礎編 読解と演習45 文法理解から応用まで' },
      { id: 'tb-jp-14', subjectId: 'japanese', name: '漢文早覚え速答法' },
      { id: 'tb-jp-15', subjectId: 'japanese', name: '国公立標準問題集CanPass古典' },
    ];

    function MainApp() {
      const [activeTab, setActiveTab] = useState('dashboard');
      
      // LocalStorage 初期化
      const [logs, setLogs] = useState(() => {
        try {
          const saved = localStorage.getItem('agri_pass_logs');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });

      const [textbooks, setTextbooks] = useState(() => {
        try {
          const saved = localStorage.getItem('agri_pass_textbooks');
          return saved ? JSON.parse(saved) : DEFAULT_TEXTBOOKS;
        } catch (e) {
          return DEFAULT_TEXTBOOKS;
        }
      });

      const [examDate, setExamDate] = useState(() => {
        try {
          const saved = localStorage.getItem('agri_pass_exam_date');
          return saved || TARGET_EXAM_DATE;
        } catch (e) {
          return TARGET_EXAM_DATE;
        }
      });

      // 同期設定
      useEffect(() => {
        try {
          localStorage.setItem('agri_pass_logs', JSON.stringify(logs));
        } catch (e) {}
      }, [logs]);

      useEffect(() => {
        try {
          localStorage.setItem('agri_pass_textbooks', JSON.stringify(textbooks));
        } catch (e) {}
      }, [textbooks]);

      useEffect(() => {
        try {
          localStorage.setItem('agri_pass_exam_date', examDate);
        } catch (e) {}
      }, [examDate]);

      // バックアップ書き出し
      const exportQuickBackup = () => {
        const data = { examDate, textbooks, logs, exportAt: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `学習記録_京大農学部_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      // バックアップ復元
      const importQuickBackup = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            if (imported.logs) setLogs(imported.logs);
            if (imported.textbooks) setTextbooks(imported.textbooks);
            if (imported.examDate) setExamDate(imported.examDate);
            alert('過去の学習記録を正常に復元しました！');
          } catch (err) {
            alert('正しいバックアップファイルを選択してください。');
          }
        };
        reader.readAsText(file);
      };

      // カウントダウン
      const daysUntilExam = useMemo(() => {
        const target = new Date(examDate);
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const diffTime = target - today;
        return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      }, [examDate]);

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans pb-24">
          {/* ヘッダー */}
          <header className="bg-gradient-to-r from-[#1B4332] via-[#2D6A4F] to-[#40916C] text-white shadow-md sticky top-0 z-40">
            <div className="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
              <div className="flex items-center space-x-2.5">
                <div className="bg-white/10 p-2 rounded-xl border border-white/20">
                  <i className="fa-solid fa-[#52B788] fa-graduation-cap text-lg text-emerald-300"></i>
                </div>
                <div>
                  <h1 className="font-bold text-base leading-tight">AgriPass</h1>
                  <p className="text-[10px] text-emerald-100/90 font-medium">京都大学 農学部 合格特化アプリ</p>
                </div>
              </div>
              
              <div className="flex items-center space-x-2">
                <button
                  onClick={exportQuickBackup}
                  title="データを保存"
                  className="bg-emerald-500 hover:bg-emerald-600 text-white px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center space-x-1 shadow-sm active:scale-95 transition-all"
                >
                  <i className="fa-solid fa-download text-xs"></i>
                  <span className="hidden sm:inline">保存</span>
                </button>
                <label
                  title="データを復元"
                  className="bg-white/20 hover:bg-white/30 text-white px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center space-x-1 border border-white/20 cursor-pointer active:scale-95 transition-all"
                >
                  <i className="fa-solid fa-upload text-xs"></i>
                  <span className="hidden sm:inline">復元</span>
                  <input type="file" accept=".json" onChange={importQuickBackup} className="hidden" />
                </label>
                <div className="bg-white/15 px-3 py-1 rounded-lg border border-white/20 text-right">
                  <div className="text-[9px] text-emerald-200 font-semibold">京大二次まで</div>
                  <div className="text-xs font-black text-white">
                    {daysUntilExam > 0 ? `あと ${daysUntilExam} 日` : '当日'}
                  </div>
                </div>
              </div>
            </div>
          </header>

          {/* メインビュー */}
          <main className="max-w-4xl mx-auto px-4 py-6">
            {activeTab === 'dashboard' && (
              <DashboardTab logs={logs} setLogs={setLogs} setActiveTab={setActiveTab} />
            )}
            {activeTab === 'timer' && (
              <TimerTab logs={logs} setLogs={setLogs} textbooks={textbooks} setTextbooks={setTextbooks} />
            )}
            {activeTab === 'tools' && (
              <ToolsTab />
            )}
            {activeTab === 'analytics' && (
              <AnalyticsTab logs={logs} textbooks={textbooks} setTextbooks={setTextbooks} />
            )}
            {activeTab === 'settings' && (
              <SettingsTab logs={logs} setLogs={setLogs} textbooks={textbooks} setTextbooks={setTextbooks} examDate={examDate} setExamDate={setExamDate} />
            )}
          </main>

          {/* ボトムナビゲーション */}
          <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-lg z-50 pb-safe">
            <div className="max-w-4xl mx-auto flex justify-around items-center h-16">
              <NavButton id="dashboard" icon="fa-house" label="ホーム" activeTab={activeTab} setActiveTab={setActiveTab} />
              <NavButton id="timer" icon="fa-stopwatch" label="タイマー" activeTab={activeTab} setActiveTab={setActiveTab} />
              <NavButton id="tools" icon="fa-calculator" label="関数電卓" activeTab={activeTab} setActiveTab={setActiveTab} />
              <NavButton id="analytics" icon="fa-chart-pie" label="分析・参考書" activeTab={activeTab} setActiveTab={setActiveTab} />
              <NavButton id="settings" icon="fa-gear" label="設定" activeTab={activeTab} setActiveTab={setActiveTab} />
            </div>
          </nav>
        </div>
      );
    }

    function NavButton({ id, icon, label, activeTab, setActiveTab }) {
      const isActive = activeTab === id;
      return (
        <button
          onClick={() => setActiveTab(id)}
          className={`flex flex-col items-center justify-center w-full h-full space-y-1 transition-all ${
            isActive ? 'text-[#1B4332] font-bold scale-105' : 'text-slate-400 hover:text-slate-600'
          }`}
        >
          <div className={`px-3 py-1 rounded-xl transition-all ${isActive ? 'bg-emerald-100/70' : ''}`}>
            <i className={`fa-solid ${icon} text-base ${isActive ? 'text-[#1B4332]' : 'text-slate-400'}`}></i>
          </div>
          <span className="text-[10px] tracking-tight">{label}</span>
        </button>
      );
    }

    // ==========================================
    // 1. DASHBOARD TAB
    // ==========================================
    function DashboardTab({ logs, setLogs, setActiveTab }) {
      const weeklyHours = useMemo(() => {
        const sevenDaysAgo = new Date();
        sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
        const recentLogs = logs.filter(log => new Date(log.date) >= sevenDaysAgo);
        const totalMinutes = recentLogs.reduce((acc, log) => acc + (log.durationMinutes || 0), 0);
        return (totalMinutes / 60).toFixed(1);
      }, [logs]);

      const totalStudyHours = useMemo(() => {
        const totalMinutes = logs.reduce((acc, log) => acc + (log.durationMinutes || 0), 0);
        return (totalMinutes / 60).toFixed(1);
      }, [logs]);

      const progressPercent = Math.min(100, Math.round((weeklyHours / WEEKLY_GOAL_HOURS) * 100));

      const handleDeleteLog = (id) => {
        if (confirm('この学習記録を削除しますか？')) {
          const updated = logs.filter(l => l.id !== id);
          setLogs(updated);
        }
      };

      return (
        <div className="space-y-6">
          <div className="bg-gradient-to-br from-[#1B4332] to-[#2D6A4F] rounded-3xl p-6 text-white shadow-lg space-y-4">
            <div className="flex justify-between items-start">
              <div>
                <span className="text-xs text-emerald-200 font-semibold uppercase tracking-wider">今週の学習時間</span>
                <div className="text-3xl font-black mt-1">
                  {weeklyHours} <span className="text-lg font-normal text-emerald-100">/ {WEEKLY_GOAL_HOURS} 時間</span>
                </div>
              </div>
              <div className="bg-white/10 px-3 py-1 rounded-full text-xs font-bold border border-white/20">
                目標達成率 {progressPercent}%
              </div>
            </div>

            <div className="w-full bg-white/20 rounded-full h-3 overflow-hidden">
              <div 
                className="bg-emerald-400 h-full rounded-full transition-all duration-500" 
                style={{ width: `${progressPercent}%` }}
              />
            </div>

            <div className="flex justify-between items-center text-xs text-emerald-100/90 pt-1">
              <span>累計学習時間: <strong className="text-white">{totalStudyHours} 時間</strong></span>
              <button 
                onClick={() => setActiveTab('timer')} 
                className="flex items-center space-x-1 font-bold text-white hover:underline bg-white/15 px-3 py-1 rounded-lg border border-white/20"
              >
                <span>タイマーで計測する</span>
                <i className="fa-solid fa-chevron-right text-[10px]"></i>
              </button>
            </div>
          </div>

          <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
            <div className="flex justify-between items-center border-b border-slate-100 pb-3">
              <h2 className="font-bold text-slate-800 text-base flex items-center space-x-2">
                <i className="fa-solid fa-clock text-[#2D6A4F]"></i>
                <span>すべての学習ログ ({logs.length}件)</span>
              </h2>
              <button 
                onClick={() => setActiveTab('timer')}
                className="text-xs font-bold text-[#1B4332] hover:underline"
              >
                ＋ 新規記録
              </button>
            </div>

            {logs.length === 0 ? (
              <div className="text-center py-10 text-slate-400 space-y-2">
                <i className="fa-solid fa-book-open text-3xl text-slate-300"></i>
                <p className="text-xs font-medium">まだ学習記録はありません。</p>
                <p className="text-[11px] text-slate-400">「タイマー」タブから勉強時間を計測して記録してみましょう！</p>
              </div>
            ) : (
              <div className="space-y-3 max-h-[450px] overflow-y-auto pr-1">
                {logs.map((log) => {
                  const subject = DEFAULT_SUBJECTS.find(s => s.id === log.subjectId) || { name: 'その他', color: '#64748b' };
                  return (
                    <div key={log.id} className="p-3.5 bg-slate-50 rounded-xl border border-slate-200 flex items-center justify-between group hover:border-emerald-300 transition-all">
                      <div className="space-y-1">
                        <div className="flex items-center space-x-2">
                          <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: subject.color }}></span>
                          <span className="text-xs font-bold text-slate-800">{subject.name}</span>
                          <span className="text-[11px] text-slate-400">• {log.date}</span>
                        </div>
                        <div className="text-sm font-semibold text-slate-700 pl-4">{log.textBook}</div>
                        {log.memo && <div className="text-xs text-slate-500 pl-4 italic">"{log.memo}"</div>}
                      </div>
                      <div className="flex items-center space-x-3">
                        <div className="text-right">
                          <div className="text-sm font-black text-[#1B4332]">{log.durationMinutes}分</div>
                          {log.pagesCovered > 0 && <div className="text-[11px] text-slate-500">{log.pagesCovered}p/問</div>}
                        </div>
                        <button 
                          onClick={() => handleDeleteLog(log.id)}
                          className="text-slate-300 hover:text-rose-600 transition-colors p-1"
                          title="削除"
                        >
                          <i className="fa-solid fa-trash-can"></i>
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // 2. TIMER TAB
    // ==========================================
    function TimerTab({ logs, setLogs, textbooks, setTextbooks }) {
      const [mode, setMode] = useState('stopwatch');
      const [seconds, setSeconds] = useState(0);
      const [isActive, setIsActive] = useState(false);
      const [timerInputMinutes, setTimerInputMinutes] = useState(25);

      const [selectedSubject, setSelectedSubject] = useState('math');
      const [selectedTextbookId, setSelectedTextbookId] = useState('');
      const [customTextbookName, setCustomTextbookName] = useState('');
      const [pagesCovered, setPagesCovered] = useState('');
      const [understanding, setUnderstanding] = useState('High');
      const [memo, setMemo] = useState('');
      const [showSaveModal, setShowSaveModal] = useState(false);

      const timerRef = useRef(null);

      const availableTextbooks = useMemo(() => {
        return textbooks.filter(tb => tb.subjectId === selectedSubject);
      }, [textbooks, selectedSubject]);

      useEffect(() => {
        if (availableTextbooks.length > 0) {
          setSelectedTextbookId(availableTextbooks[0].id);
        } else {
          setSelectedTextbookId('new');
        }
      }, [selectedSubject, availableTextbooks]);

      useEffect(() => {
        if (isActive) {
          timerRef.current = setInterval(() => {
            setSeconds((prev) => {
              if (mode === 'timer' && prev <= 1) {
                clearInterval(timerRef.current);
                setIsActive(false);
                setShowSaveModal(true);
                return 0;
              }
              return mode === 'timer' ? prev - 1 : prev + 1;
            });
          }, 1000);
        } else {
          clearInterval(timerRef.current);
        }
        return () => clearInterval(timerRef.current);
      }, [isActive, mode]);

      const handleStart = () => {
        if (mode === 'timer' && seconds === 0) {
          setSeconds(timerInputMinutes * 60);
        }
        setIsActive(true);
      };

      const handlePause = () => {
        setIsActive(false);
      };

      const handleReset = () => {
        setIsActive(false);
        setSeconds(mode === 'timer' ? timerInputMinutes * 60 : 0);
      };

      const handleModeSwitch = (newMode) => {
        setIsActive(false);
        setMode(newMode);
        setSeconds(newMode === 'timer' ? timerInputMinutes * 60 : 0);
      };

      const handleSaveLog = (e) => {
        e.preventDefault();
        
        const totalElapsedSec = mode === 'timer' ? (timerInputMinutes * 60 - seconds) : seconds;
        const elapsedMinutes = Math.max(1, Math.round(totalElapsedSec / 60));

        let textBookName = '';
        let tbId = selectedTextbookId;

        if (selectedTextbookId === 'new') {
          if (!customTextbookName.trim()) {
            alert('参考書名を入力してください');
            return;
          }
          textBookName = customTextbookName.trim();
          const newTb = {
            id: 'tb_' + String(Date.now()) + '_' + Math.floor(Math.random() * 1000),
            subjectId: selectedSubject,
            name: textBookName
          };
          setTextbooks(prev => [...prev, newTb]);
          tbId = newTb.id;
        } else {
          const found = textbooks.find(tb => tb.id === selectedTextbookId);
          textBookName = found ? found.name : '自主学習';
        }

        const newLog = {
          id: 'log_' + String(Date.now()) + '_' + Math.floor(Math.random() * 1000),
          date: new Date().toISOString().split('T')[0],
          subjectId: String(selectedSubject),
          textbookId: String(tbId),
          textBook: String(textBookName),
          durationMinutes: Number(elapsedMinutes),
          pagesCovered: Number(pagesCovered) || 0,
          understanding: String(understanding),
          memo: String(memo)
        };

        const nextLogs = [newLog, ...logs];
        setLogs(nextLogs);

        try {
          localStorage.setItem('agri_pass_logs', JSON.stringify(nextLogs));
        } catch (err) {}

        setShowSaveModal(false);
        handleReset();
        setCustomTextbookName('');
        setPagesCovered('');
        setMemo('');
        alert('学習記録を保存しました！');
      };

      const formatTime = (totalSec) => {
        const hrs = Math.floor(totalSec / 3600);
        const mins = Math.floor((totalSec % 3600) / 60);
        const secs = totalSec % 60;
        return `${hrs > 0 ? String(hrs).padStart(2, '0') + ':' : ''}${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      };

      return (
        <div className="space-y-6 max-w-xl mx-auto">
          {/* 参考書選択 */}
          <div className="bg-white rounded-2xl border border-emerald-200 p-5 shadow-sm space-y-3">
            <div className="text-xs font-bold text-[#1B4332] flex items-center space-x-1.5">
              <i className="fa-solid fa-book text-[#2D6A4F]"></i>
              <span>勉強する教科と参考書を選択</span>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label className="block text-[11px] font-semibold text-slate-500 mb-1">教科</label>
                <select 
                  value={selectedSubject} 
                  onChange={(e) => setSelectedSubject(e.target.value)}
                  className="w-full text-xs p-2.5 rounded-xl border border-slate-300 bg-slate-50 font-bold text-slate-800"
                >
                  {DEFAULT_SUBJECTS.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-[11px] font-semibold text-slate-500 mb-1">参考書</label>
                <select 
                  value={selectedTextbookId} 
                  onChange={(e) => setSelectedTextbookId(e.target.value)}
                  className="w-full text-xs p-2.5 rounded-xl border border-slate-300 bg-slate-50 font-bold text-slate-800"
                >
                  {availableTextbooks.map(tb => (
                    <option key={tb.id} value={tb.id}>{tb.name}</option>
                  ))}
                  <option value="new">＋ 新しい参考書を登録...</option>
                </select>
              </div>
            </div>

            {selectedTextbookId === 'new' && (
              <div>
                <input 
                  type="text" 
                  value={customTextbookName} 
                  onChange={(e) => setCustomTextbookName(e.target.value)}
                  placeholder="新しい参考書名を入力"
                  className="w-full text-xs p-2.5 rounded-xl border border-emerald-300 bg-emerald-50/50"
                />
              </div>
            )}
          </div>

          {/* モード切替 */}
          <div className="bg-slate-200/70 p-1 rounded-xl flex">
            <button 
              onClick={() => handleModeSwitch('stopwatch')}
              className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all ${mode === 'stopwatch' ? 'bg-white text-[#1B4332] shadow-sm' : 'text-slate-600'}`}
            >
              ストップウォッチ (計測)
            </button>
            <button 
              onClick={() => handleModeSwitch('timer')}
              className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all ${mode === 'timer' ? 'bg-white text-[#1B4332] shadow-sm' : 'text-slate-600'}`}
            >
              カウントダウン (ポモドーロ)
            </button>
          </div>

          {/* タイマー表示 */}
          <div className="bg-white rounded-3xl border border-slate-200 p-8 shadow-sm text-center space-y-6">
            {mode === 'timer' && !isActive && seconds === 0 && (
              <div className="flex justify-center items-center space-x-2 mb-4">
                <span className="text-xs text-slate-500 font-medium">時間設定:</span>
                {[15, 25, 45, 60].map(m => (
                  <button
                    key={m}
                    onClick={() => { setTimerInputMinutes(m); setSeconds(m * 60); }}
                    className={`px-3 py-1 rounded-lg text-xs font-bold border ${timerInputMinutes === m ? 'bg-[#1B4332] text-white border-[#1B4332]' : 'bg-slate-50 text-slate-600 border-slate-200'}`}
                  >
                    {m}分
                  </button>
                ))}
              </div>
            )}

            <div className="py-2">
              <div className="text-6xl font-mono font-bold text-slate-800 tracking-wider">
                {formatTime(seconds)}
              </div>
              <p className="text-xs text-slate-500 mt-3 font-semibold">
                {isActive ? '集中して取り組みましょう！' : 'スタートボタンで計測開始'}
              </p>
            </div>

            <div className="flex justify-center items-center space-x-3">
              {!isActive ? (
                <button 
                  onClick={handleStart}
                  className="bg-[#1B4332] hover:bg-[#2D6A4F] text-white font-bold px-7 py-3 rounded-2xl shadow-md transition-all flex items-center space-x-2 text-sm active:scale-95"
                >
                  <i className="fa-solid fa-play"></i>
                  <span>スタート</span>
                </button>
              ) : (
                <button 
                  onClick={handlePause}
                  className="bg-amber-500 hover:bg-amber-600 text-white font-bold px-7 py-3 rounded-2xl shadow-md transition-all flex items-center space-x-2 text-sm active:scale-95"
                >
                  <i className="fa-solid fa-pause"></i>
                  <span>一時停止</span>
                </button>
              )}

              <button 
                onClick={handleReset}
                className="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold p-3 rounded-2xl transition-all"
                title="リセット"
              >
                <i className="fa-solid fa-rotate-left"></i>
              </button>

              <button 
                onClick={() => setShowSaveModal(true)}
                disabled={seconds === 0 && mode === 'stopwatch'}
                className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 py-3 rounded-2xl shadow-md transition-all flex items-center space-x-1.5 text-xs active:scale-95 disabled:opacity-50"
              >
                <i className="fa-solid fa-floppy-disk"></i>
                <span>記録保存</span>
              </button>
            </div>
          </div>

          {/* モーダル */}
          {showSaveModal && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl border border-slate-200 p-6 max-w-md w-full shadow-xl space-y-4">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h3 className="font-bold text-slate-800 flex items-center space-x-2 text-sm">
                    <i className="fa-solid fa-floppy-disk text-[#2D6A4F]"></i>
                    <span>学習記録を保存</span>
                  </h3>
                  <button onClick={() => setShowSaveModal(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>

                <form onSubmit={handleSaveLog} className="space-y-4">
                  <div className="bg-emerald-50 p-3 rounded-xl border border-emerald-200">
                    <div className="text-[10px] text-emerald-700 font-semibold">記録対象</div>
                    <div className="text-xs font-bold text-[#1B4332] mt-0.5">
                      {DEFAULT_SUBJECTS.find(s=>s.id===selectedSubject)?.name} - {textbooks.find(t=>t.id===selectedTextbookId)?.name || customTextbookName || '未選択'}
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">ページ/問題数</label>
                      <input 
                        type="number" 
                        value={pagesCovered} 
                        onChange={(e) => setPagesCovered(e.target.value)}
                        placeholder="例: 10"
                        className="w-full text-xs p-2.5 rounded-xl border border-slate-300 bg-white"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">理解度</label>
                      <select 
                        value={understanding} 
                        onChange={(e) => setUnderstanding(e.target.value)}
                        className="w-full text-xs p-2.5 rounded-xl border border-slate-300 bg-white"
                      >
                        <option value="High">高 (完璧)</option>
                        <option value="Medium">中 (要復習)</option>
                        <option value="Low">低 (難解)</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">振り返りメモ</label>
                    <textarea 
                      value={memo} 
                      onChange={(e) => setMemo(e.target.value)}
                      placeholder="例: 公式の適用条件に注意。"
                      className="w-full text-xs p-2.5 rounded-xl border border-slate-300 bg-white h-20 resize-none"
                    />
                  </div>

                  <div className="flex justify-end space-x-2 pt-2">
                    <button 
                      type="button" 
                      onClick={() => setShowSaveModal(false)}
                      className="px-4 py-2 rounded-xl border border-slate-300 text-xs font-semibold text-slate-600 hover:bg-slate-100"
                    >
                      キャンセル
                    </button>
                    <button 
                      type="submit" 
                      className="px-5 py-2 rounded-xl bg-[#1B4332] text-white text-xs font-bold hover:bg-[#2D6A4F] shadow-sm"
                    >
                      保存する
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 3. SCIENTIFIC CALCULATOR TAB
    // ==========================================
    function ToolsTab() {
      const [calcDisplay, setCalcDisplay] = useState('0');

      const safeEvaluate = (expression) => {
        try {
          const sanitized = expression
            .replace(/×/g, '*')
            .replace(/÷/g, '/')
            .replace(/π/g, String(Math.PI))
            .replace(/e/g, String(Math.E));
          
          if (/[^0-9\+\-\*\/\(\)\.\s]/.test(sanitized)) {
            return 'Error';
          }

          const fn = new Function(`return ${sanitized}`);
          const result = fn();
          return Number.isFinite(result) ? String(result) : 'Error';
        } catch {
          return 'Error';
        }
      };

      const handleCalcBtn = (val) => {
        if (val === 'C') {
          setCalcDisplay('0');
          return;
        }
        if (val === '=') {
          setCalcDisplay(safeEvaluate(calcDisplay));
          return;
        }
        if (['sin', 'cos', 'tan', 'log', 'sqrt'].includes(val)) {
          try {
            const num = parseFloat(calcDisplay);
            let res = 0;
            if (val === 'sin') res = Math.sin((num * Math.PI) / 180);
            if (val === 'cos') res = Math.cos((num * Math.PI) / 180);
            if (val === 'tan') res = Math.tan((num * Math.PI) / 180);
            if (val === 'log') res = Math.log10(num);
            if (val === 'sqrt') res = Math.sqrt(num);
            setCalcDisplay(String(Number(res.toFixed(6))));
          } catch (err) {
            setCalcDisplay('Error');
          }
          return;
        }

        if (calcDisplay === '0' || calcDisplay === 'Error') {
          setCalcDisplay(val);
        } else {
          setCalcDisplay(calcDisplay + val);
        }
      };

      return (
        <div className="space-y-6">
          <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm max-w-sm mx-auto space-y-4">
            <div className="text-center">
              <h3 className="font-bold text-slate-800 text-base flex items-center justify-center space-x-2">
                <i className="fa-solid fa-calculator text-[#2D6A4F]"></i>
                <span>京大理系学習用 関数電卓</span>
              </h3>
              <p className="text-xs text-slate-400 mt-0.5">数学・物理・化学の各種計算に便利</p>
            </div>

            <div className="bg-slate-900 text-emerald-400 p-4 rounded-xl text-right font-mono text-2xl tracking-wider overflow-x-auto min-h-[3.5rem] flex items-center justify-end shadow-inner">
              {calcDisplay}
            </div>

            <div className="grid grid-cols-4 gap-2">
              {['sin', 'cos', 'tan', 'log'].map(btn => (
                <button key={btn} onClick={() => handleCalcBtn(btn)} className="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold p-3 rounded-xl active:scale-95 transition-all">{btn}</button>
              ))}
              {['sqrt', '(', ')', '÷'].map(btn => (
                <button key={btn} onClick={() => handleCalcBtn(btn)} className="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold p-3 rounded-xl active:scale-95 transition-all">{btn}</button>
              ))}
              {['7', '8', '9', '×'].map(btn => (
                <button key={btn} onClick={() => handleCalcBtn(btn)} className="bg-slate-50 hover:bg-slate-100 text-slate-800 font-bold p-3.5 rounded-xl active:scale-95 transition-all">{btn}</button>
              ))}
              {['4', '5', '6', '-'].map(btn => (
                <button key={btn} onClick={() => handleCalcBtn(btn)} className="bg-slate-50 hover:bg-slate-100 text-slate-800 font-bold p-3.5 rounded-xl active:scale-95 transition-all">{btn}</button>
              ))}
              {['1', '2', '3', '+'].map(btn => (
                <button key={btn} onClick={() => handleCalcBtn(btn)} className="bg-slate-50 hover:bg-slate-100 text-slate-800 font-bold p-3.5 rounded-xl active:scale-95 transition-all">{btn}</button>
              ))}
              {['C', '0', '.', '='].map(btn => (
                <button key={btn} onClick={() => handleCalcBtn(btn)} className={`font-bold p-3.5 rounded-xl active:scale-95 transition-all ${btn === '=' ? 'bg-[#1B4332] text-white shadow-md' : btn === 'C' ? 'bg-rose-100 text-rose-700' : 'bg-slate-50 text-slate-800'}`}>{btn}</button>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 4. ANALYTICS & TEXTBOOKS TAB
    // ==========================================
    function AnalyticsTab({ logs, textbooks, setTextbooks }) {
      const [newSubId, setNewSubId] = useState('math');
      const [newTbName, setNewTbName] = useState('');

      const subjectTotals = useMemo(() => {
        const map = {};
        DEFAULT_SUBJECTS.forEach(s => { map[s.id] = 0; });
        logs.forEach(log => {
          if (map[log.subjectId] !== undefined) {
            map[log.subjectId] += (log.durationMinutes || 0);
          }
        });
        return map;
      }, [logs]);

      const totalMinutes = useMemo(() => {
        return Object.values(subjectTotals).reduce((a, b) => a + b, 0);
      }, [subjectTotals]);

      const handleAddTextbook = (e) => {
        e.preventDefault();
        if (!newTbName.trim()) return;
        const newBook = {
          id: 'tb_' + String(Date.now()),
          subjectId: newSubId,
          name: newTbName.trim()
        };
        setTextbooks(prev => [...prev, newBook]);
        setNewTbName('');
        alert(`『${newBook.name}』を登録しました！`);
      };

      const handleDeleteTextbook = (id, name) => {
        if (confirm(`参考書『${name}』を削除しますか？`)) {
          setTextbooks(prev => prev.filter(tb => tb.id !== id));
        }
      };

      return (
        <div className="space-y-6 max-w-2xl mx-auto">
          <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
            <h2 className="font-bold text-slate-800 text-base flex items-center space-x-2">
              <i className="fa-solid fa-chart-pie text-[#2D6A4F]"></i>
              <span>教科別累計時間</span>
            </h2>

            <div className="space-y-3">
              {DEFAULT_SUBJECTS.map(s => {
                const mins = subjectTotals[s.id] || 0;
                const hours = (mins / 60).toFixed(1);
                const percent = totalMinutes > 0 ? Math.round((mins / totalMinutes) * 100) : 0;
                return (
                  <div key={s.id} className="space-y-1">
                    <div className="flex justify-between text-xs font-semibold">
                      <span className="text-slate-700">{s.name}</span>
                      <span className="text-slate-500">{hours}時間 ({percent}%)</span>
                    </div>
                    <div className="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                      <div 
                        className="h-full rounded-full transition-all duration-300"
                        style={{ width: `${percent}%`, backgroundColor: s.color }}
                      />
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          <div className="bg-white rounded-2xl border border-emerald-200 p-5 shadow-sm space-y-3">
            <h2 className="font-bold text-slate-800 text-sm flex items-center space-x-2">
              <i className="fa-solid fa-plus text-[#2D6A4F]"></i>
              <span>新しい参考書を追加登録</span>
            </h2>
            <form onSubmit={handleAddTextbook} className="grid grid-cols-1 sm:grid-cols-3 gap-2">
              <select 
                value={newSubId}
                onChange={(e) => setNewSubId(e.target.value)}
                className="text-xs p-2.5 rounded-xl border border-slate-300 bg-slate-50 font-bold"
              >
                {DEFAULT_SUBJECTS.map(s => (
                  <option key={s.id} value={s.id}>{s.name}</option>
                ))}
              </select>
              <input 
                type="text"
                value={newTbName}
                onChange={(e) => setNewTbName(e.target.value)}
                placeholder="参考書名を入力"
                className="text-xs p-2.5 rounded-xl border border-slate-300 bg-white"
              />
              <button 
                type="submit"
                className="bg-[#1B4332] hover:bg-[#2D6A4F] text-white text-xs font-bold rounded-xl p-2.5 transition-all flex items-center justify-center space-x-1 active:scale-95"
              >
                <i className="fa-solid fa-plus"></i>
                <span>追加</span>
              </button>
            </form>
          </div>

          <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
            <h2 className="font-bold text-slate-800 text-base flex items-center space-x-2">
              <i className="fa-solid fa-book text-[#2D6A4F]"></i>
              <span>登録済みの参考書一覧 ({textbooks.length}冊)</span>
            </h2>

            <div className="space-y-4">
              {DEFAULT_SUBJECTS.map(s => {
                const subBooks = textbooks.filter(tb => tb.subjectId === s.id);
                if (subBooks.length === 0) return null;
                return (
                  <div key={s.id} className="border-l-2 pl-3 space-y-1.5" style={{ borderColor: s.color }}>
                    <div className="text-xs font-bold text-slate-800">{s.name} ({subBooks.length}冊)</div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
                      {subBooks.map(b => (
                        <div key={b.id} className="text-[11px] bg-slate-50 p-2 rounded-lg border border-slate-200 text-slate-700 flex items-center justify-between">
                          <span className="truncate pr-2">{b.name}</span>
                          <button 
                            onClick={() => handleDeleteTextbook(b.id, b.name)}
                            className="text-slate-300 hover:text-rose-500 transition-colors p-0.5"
                            title="削除"
                          >
                            <i className="fa-solid fa-trash-can"></i>
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 5. SETTINGS TAB
    // ==========================================
    function SettingsTab({ logs, setLogs, textbooks, setTextbooks, examDate, setExamDate }) {
      const handleExportJSON = () => {
        const data = {
          examDate,
          textbooks,
          logs,
          exportAt: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `agri_pass_backup_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleImportJSON = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            if (imported.logs) setLogs(imported.logs);
            if (imported.textbooks) setTextbooks(imported.textbooks);
            if (imported.examDate) setExamDate(imported.examDate);
            alert('データを正常に復元しました！');
          } catch (err) {
            alert('正しいJSONバックアップファイルを選択してください。');
          }
        };
        reader.readAsText(file);
      };

      const handleResetData = () => {
        if (confirm('すべての学習ログ・追加した参考書を削除して初期化しますか？')) {
          setLogs([]);
          setTextbooks(DEFAULT_TEXTBOOKS);
          localStorage.clear();
          alert('全データを初期化しました。');
        }
      };

      return (
        <div className="space-y-6 max-w-xl mx-auto">
          <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
            <h3 className="font-bold text-slate-800 text-base">受験目標日</h3>
            <div>
              <label className="block text-xs text-slate-500 mb-1">京都大学 二次試験日</label>
              <input 
                type="date" 
                value={examDate} 
                onChange={(e) => setExamDate(e.target.value)}
                className="w-full text-sm p-2.5 rounded-xl border border-slate-300 bg-white font-semibold"
              />
            </div>
          </div>

          <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
            <div>
              <h3 className="font-bold text-slate-800 text-base">バックアップと復元</h3>
              <p className="text-xs text-slate-500 mt-0.5">記録は端末に即時保存されます。学校のタブレット等とデータを共有したい時はファイルを書き出して読み込んでください。</p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              <button 
                onClick={handleExportJSON}
                className="p-3 bg-emerald-50 hover:bg-emerald-100 text-[#1B4332] font-bold rounded-xl border border-emerald-200 transition-all flex items-center justify-center space-x-2 text-xs active:scale-95"
              >
                <i className="fa-solid fa-download"></i>
                <span>書き出し (JSON)</span>
              </button>

              <label className="p-3 bg-slate-50 hover:bg-slate-100 text-slate-700 font-bold rounded-xl border border-slate-200 transition-all flex items-center justify-center space-x-2 text-xs cursor-pointer active:scale-95">
                <i className="fa-solid fa-upload"></i>
                <span>読み込み (JSON)</span>
                <input type="file" accept=".json" onChange={handleImportJSON} className="hidden" />
              </label>
            </div>
          </div>

          <div className="bg-white rounded-2xl border border-rose-100 p-5 shadow-sm space-y-3">
            <h3 className="font-bold text-rose-700 text-sm">データリセット</h3>
            <button 
              onClick={handleResetData}
              className="px-4 py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold rounded-xl border border-rose-200 transition-all text-xs flex items-center space-x-1.5 active:scale-95"
            >
              <i className="fa-solid fa-trash-can"></i>
              <span>全データを初期化</span>
            </button>
          </div>
        </div>
      );
    }

    // DOMへのレンダリング
    const root = ReactDOM.createRoot(document.getElementById('app'));
    root.render(<MainApp />);
  </script>
</body>
</html>
