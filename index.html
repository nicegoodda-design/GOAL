<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriPass - 京大農学部合格プロジェクト</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-16">

  <!-- Header -->
  <header class="bg-emerald-700 text-white p-4 shadow-lg sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-leaf text-2xl text-emerald-300"></i>
        <h1 class="text-xl font-bold tracking-wide">AgriPass <span class="text-xs font-normal bg-emerald-800 px-2 py-0.5 rounded-full">京大農学部合格</span></h1>
      </div>
      <div class="text-xs text-right">
        <p id="countdown" class="font-bold text-amber-300">受験日まで あと -- 日</p>
        <p id="weekly-goal" class="text-emerald-100">今週の目標: -- / 45時間</p>
      </div>
    </div>
  </header>

  <!-- Navigation -->
  <nav class="max-w-4xl mx-auto bg-white border-b border-slate-200 sticky top-14 z-40 shadow-sm flex justify-around">
    <button onclick="switchTab('timer')" id="nav-timer" class="nav-btn py-3 px-4 text-emerald-600 border-b-2 border-emerald-600 font-semibold flex items-center space-x-1">
      <i class="fa-solid fa-stopwatch"></i><span>タイマー</span>
    </button>
    <button onclick="switchTab('calc')" id="nav-calc" class="nav-btn py-3 px-4 text-slate-500 hover:text-emerald-600 font-semibold flex items-center space-x-1">
      <i class="fa-solid fa-calculator"></i><span>理系電卓</span>
    </button>
    <button onclick="switchTab('books')" id="nav-books" class="nav-btn py-3 px-4 text-slate-500 hover:text-emerald-600 font-semibold flex items-center space-x-1">
      <i class="fa-solid fa-book"></i><span>参考書</span>
    </button>
    <button onclick="switchTab('logs')" id="nav-logs" class="nav-btn py-3 px-4 text-slate-500 hover:text-emerald-600 font-semibold flex items-center space-x-1">
      <i class="fa-solid fa-chart-line"></i><span>記録</span>
    </button>
  </nav>

  <!-- Main Content Area -->
  <main class="max-w-4xl mx-auto p-4 space-y-6">

    <!-- TIMER TAB -->
    <section id="tab-timer" class="tab-content">
      <div class="bg-white rounded-2xl p-6 shadow-md border border-slate-200 text-center space-y-6">
        <h2 class="text-lg font-bold text-slate-700">学習タイマー & 記録</h2>
        
        <!-- Subject & Book Selection -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-left max-w-md mx-auto">
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1">教科</label>
            <select id="timer-subject" onchange="updateBookDropdown()" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm font-medium focus:ring-2 focus:ring-emerald-500 focus:outline-none">
              <option value="英語">英語</option>
              <option value="数学">数学</option>
              <option value="理科">理科（化学・物理）</option>
              <option value="国語">国語（現代文・古文・漢文）</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1">参考書</label>
            <select id="timer-book" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm font-medium focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </select>
          </div>
        </div>

        <!-- Timer Display -->
        <div class="py-6">
          <span id="timer-display" class="font-mono text-6xl font-extrabold text-slate-800 tracking-wider">00:00:00</span>
        </div>

        <!-- Timer Controls -->
        <div class="flex justify-center space-x-4">
          <button id="btn-start" onclick="startTimer()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition active:scale-95 flex items-center space-x-2">
            <i class="fa-solid fa-play"></i><span>スタート</span>
          </button>
          <button id="btn-pause" onclick="pauseTimer()" class="hidden bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition active:scale-95 flex items-center space-x-2">
            <i class="fa-solid fa-pause"></i><span>一時停止</span>
          </button>
          <button id="btn-stop" onclick="stopAndSaveTimer()" class="bg-slate-700 hover:bg-slate-800 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition active:scale-95 flex items-center space-x-2">
            <i class="fa-solid fa-floppy-disk"></i><span>保存</span>
          </button>
        </div>
      </div>
    </section>

    <!-- CALCULATOR TAB -->
    <section id="tab-calc" class="tab-content hidden">
      <div class="bg-white rounded-2xl p-6 shadow-md border border-slate-200 max-w-md mx-auto space-y-4">
        <h2 class="text-lg font-bold text-slate-700 text-center">理系用関数電卓</h2>
        
        <input type="text" id="calc-screen" readonly class="w-full bg-slate-900 text-emerald-400 font-mono text-right text-2xl font-bold p-4 rounded-xl shadow-inner border border-slate-700 focus:outline-none" value="0">
        
        <div class="grid grid-cols-4 gap-2 text-sm font-bold">
          <button onclick="calcCmd('sin')" class="bg-slate-200 hover:bg-slate-300 p-3 rounded-lg">sin</button>
          <button onclick="calcCmd('cos')" class="bg-slate-200 hover:bg-slate-300 p-3 rounded-lg">cos</button>
          <button onclick="calcCmd('tan')" class="bg-slate-200 hover:bg-slate-300 p-3 rounded-lg">tan</button>
          <button onclick="calcCmd('C')" class="bg-rose-500 text-white hover:bg-rose-600 p-3 rounded-lg">C</button>

          <button onclick="calcCmd('sqrt')" class="bg-slate-200 hover:bg-slate-300 p-3 rounded-lg">√</button>
          <button onclick="calcCmd('log')" class="bg-slate-200 hover:bg-slate-300 p-3 rounded-lg">log</button>
          <button onclick="calcCmd('pow')" class="bg-slate-200 hover:bg-slate-300 p-3 rounded-lg">x^y</button>
          <button onclick="calcCmd('/')" class="bg-emerald-600 text-white p-3 rounded-lg font-bold">÷</button>

          <button onclick="calcNum('7')" class="bg-slate-100 hover:bg-slate-200 p-3 rounded-lg text-lg">7</button>
          <button onclick="calcNum('8')" class="bg-slate-100 hover:bg-slate-200 p-3 rounded-lg text-lg">8</button>
          <button onclick="calcNum('9')" class="bg-slate-100 hover:bg-slate-200 p-3 rounded-lg text-lg">9</button>
          <button onclick="calcCmd('*')" class="bg-emerald-600 text-white p-3 rounded-lg font-bold">×</button>

          <button onclick="calcNum('4')" class="bg-slate-100 hover:bg-slate-200 p-3 rounded-lg text-lg">4</button>
          <button onclick="calcNum('5')" class="bg-slate-100 hover:bg-slate-200 p-3 rounded-lg text-lg">5</button>
          <button onclick="calcNum('6')" class="bg-slate-100 hover:bg-slate-200 p-3 rounded-lg text-lg">6</button>
          <button onclick="calcCmd('-')" class="bg-emerald-600 text-white p-3 rounded-lg font-bold">-</button>

          <button onclick="calcNum('1')" class="bg-slate-100 hover:bg-slate-200 p-3 rounded-lg text-lg">1</button>
          <button onclick="calcNum('2')" class="bg-slate-100 hover:bg-slate-200 p-3 rounded-lg text-lg">2</button>
          <button onclick="calcNum('3')" class="bg-slate-100 hover:bg-slate-200 p-3 rounded-lg text-lg">3</button>
          <button onclick="calcCmd('+')" class="bg-emerald-600 text-white p-3 rounded-lg font-bold">+</button>

          <button onclick="calcNum('0')" class="bg-slate-100 hover:bg-slate-200 p-3 rounded-lg text-lg">0</button>
          <button onclick="calcNum('.')" class="bg-slate-100 hover:bg-slate-200 p-3 rounded-lg text-lg">.</button>
          <button onclick="calcCmd('pi')" class="bg-slate-200 hover:bg-slate-300 p-3 rounded-lg">π</button>
          <button onclick="calcEqual()" class="bg-amber-500 hover:bg-amber-600 text-white p-3 rounded-lg font-bold text-lg">=</button>
        </div>
      </div>
    </section>

    <!-- BOOKS TAB -->
    <section id="tab-books" class="tab-content hidden space-y-6">
      <div class="bg-white rounded-2xl p-6 shadow-md border border-slate-200 space-y-4">
        <h2 class="text-lg font-bold text-slate-700">参考書の管理・追加</h2>
        <div class="flex flex-col sm:flex-row gap-3">
          <select id="new-book-subject" class="bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm font-medium focus:ring-2 focus:ring-emerald-500">
            <option value="英語">英語</option>
            <option value="数学">数学</option>
            <option value="理科">理科</option>
            <option value="国語">国語</option>
          </select>
          <input type="text" id="new-book-title" placeholder="新しい参考書名を入力..." class="flex-1 bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500">
          <button onclick="addNewBook()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-5 rounded-lg shadow transition">
            追加
          </button>
        </div>
      </div>

      <div class="bg-white rounded-2xl p-6 shadow-md border border-slate-200 space-y-4">
        <h3 class="font-bold text-slate-700 border-b pb-2">登録中の参考書一覧</h3>
        <div id="books-list" class="space-y-4">
          <!-- Populated by JS -->
        </div>
      </div>
    </section>

    <!-- LOGS TAB -->
    <section id="tab-logs" class="tab-content hidden space-y-6">
      <div class="bg-white rounded-2xl p-6 shadow-md border border-slate-200 space-y-4">
        <h2 class="text-lg font-bold text-slate-700">教科別累計学習時間</h2>
        <div id="subject-totals" class="grid grid-cols-2 sm:grid-cols-4 gap-4">
          <!-- Populated by JS -->
        </div>
      </div>

      <div class="bg-white rounded-2xl p-6 shadow-md border border-slate-200 space-y-4">
        <h3 class="font-bold text-slate-700 border-b pb-2">学習履歴ログ</h3>
        <div id="logs-list" class="space-y-3 max-h-96 overflow-y-auto">
          <!-- Populated by JS -->
        </div>
      </div>
    </section>

  </main>

  <script>
    // --- Initial Data Setup ---
    const defaultBooks = {
      英語: ["Stock4500", "ランク順入試英熟語1100", "速読英単語 上級編", "関正生の英文法ポラリス1 標準レベル", "大学入試世界一わかりやすい英文読解の特別講座", "大学受験のための英文熟考 上", "大学受験のための英文熟考 下", "やっておきたい英語長文300", "やっておきたい英語長文500", "関正生のThe Rules 英語長文問題集1 入試基礎", "関正生のThe Rules 英語長文問題集2 入試標準", "関正生のThe Rules 英語長文問題集3 入試難関", "関正生のThe Rules 英語長文問題集4 入試最難関", "関正生の英語長文ポラリス1 標準レベル", "関正生の英語長文ポラリス2 応用レベル", "関正生の英語長文ポラリス3 発展レベル", "英語長文問題精選ファイナル", "国公立標準問題集CanPass 英語", "大学入試英語長文プラス記述式トレーニング問題集", "竹岡広信の英作文が面白いほど書ける本 決定版"],
      数学: ["数学I・A 入門問題精講", "数学II・B 入門問題精講", "数学III・C 入門問題精講", "Focus Gold 数学I+A", "Focus Gold 数学II+B", "Focus Gold 数学III", "1対1対応の演習／数学I", "1対1対応の演習／数学A", "1対1対応の演習／数学II", "1対1対応の演習／数学B", "1対1対応の演習／数学III 微積分編", "1対1対応の演習／数学III 曲線・複素数編", "数学I+A+II+B 上級問題精講", "数学III 上級問題精講"],
      理科: ["スクエア最新図説化学", "橋爪のゼロから劇的にわかる理論化学", "橋爪のゼロから劇的にわかる無機化学 有機化学", "化学の新標準演習", "鎌田の理論化学の講義", "福間の無機化学の講義", "鎌田の有機化学の講義", "ここで差がつく有機化合物の構造決定問題の要点・演習", "化学重要問題集", "スタサプ物理", "物理教室", "良問の風 物理頻出・標準入試問題集", "名問の森 物理［力学・熱・波動I］", "名問の森 物理［波動II・電磁気・原子］"],
      国語: ["読解を深める現代文単語 評論・小説", "マドンナ古文常識", "古文単語グループ600", "船口のゼロから読み解く最強の現代文", "船口の記述トレーニング", "現代文基礎問題精講", "入試現代文へのアクセス 基本編", "入試現代文へのアクセス 発展編", "現代文読解力の開発講座", "現代文と格闘する", "八澤のたった6時間で古典文法", "八澤のたった3時間で古文読解", "古文上達 基礎編 読解と演習45", "漢文早覚え速答法", "国公立標準問題集CanPass古典"]
    };

    let userBooks = JSON.parse(localStorage.getItem('agri_books')) || defaultBooks;
    let studyLogs = JSON.parse(localStorage.getItem('agri_logs')) || [];

    // --- Tab Navigation ---
    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-btn').forEach(el => {
        el.classList.remove('text-emerald-600', 'border-b-2', 'border-emerald-600');
        el.classList.add('text-slate-500');
      });
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      document.getElementById(`nav-${tab}`).classList.add('text-emerald-600', 'border-b-2', 'border-emerald-600');
      document.getElementById(`nav-${tab}`).classList.remove('text-slate-500');

      if (tab === 'books') renderBooksList();
      if (tab === 'logs') renderLogs();
    }

    // --- Countdown Calculator ---
    function initCountdown() {
      const examDate = new Date('2028-02-25T00:00:00');
      const today = new Date();
      const diffTime = examDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      document.getElementById('countdown').innerText = `受験日まで あと ${diffDays > 0 ? diffDays : 0} 日`;
    }

    // --- Background-Resistant Timer System ---
    let timerInterval = null;
    let startTime = null;
    let accumulatedTime = 0;

    let savedState = JSON.parse(localStorage.getItem('agri_timer_state'));
    if (savedState) {
      accumulatedTime = savedState.accumulatedTime || 0;
      if (savedState.isRunning && savedState.startTime) {
        startTime = savedState.startTime;
        startTimer(true);
      } else {
        updateTimerDisplay(accumulatedTime);
      }
    }

    function updateBookDropdown() {
      const subj = document.getElementById('timer-subject').value;
      const bookSelect = document.getElementById('timer-book');
      bookSelect.innerHTML = '';
      const books = userBooks[subj] || [];
      books.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b;
        opt.innerText = b;
        bookSelect.appendChild(opt);
      });
    }

    function getCurrentElapsedSeconds() {
      if (!startTime) return accumulatedTime;
      const now = Date.now();
      return accumulatedTime + Math.floor((now - startTime) / 1000);
    }

    function startTimer(isResume = false) {
      if (!isResume) {
        startTime = Date.now();
      }
      saveTimerState(true);

      document.getElementById('btn-start').classList.add('hidden');
      document.getElementById('btn-pause').classList.remove('hidden');

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        updateTimerDisplay(getCurrentElapsedSeconds());
      }, 1000);
    }

    function pauseTimer() {
      if (startTime) {
        accumulatedTime += Math.floor((Date.now() - startTime) / 1000);
        startTime = null;
      }
      clearInterval(timerInterval);
      timerInterval = null;
      saveTimerState(false);

      document.getElementById('btn-pause').classList.add('hidden');
      document.getElementById('btn-start').classList.remove('hidden');
      updateTimerDisplay(accumulatedTime);
    }

    function saveTimerState(isRunning) {
      localStorage.setItem('agri_timer_state', JSON.stringify({
        isRunning: isRunning,
        startTime: startTime,
        accumulatedTime: accumulatedTime
      }));
    }

    function updateTimerDisplay(totalSeconds) {
      const hrs = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
      const mins = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
      const secs = String(totalSeconds % 60).padStart(2, '0');
      document.getElementById('timer-display').innerText = `${hrs}:${mins}:${secs}`;
    }

    function stopAndSaveTimer() {
      const totalSecs = getCurrentElapsedSeconds();
      if (totalSecs === 0) return alert('学習時間を記録してください。');
      
      pauseTimer();

      const subject = document.getElementById('timer-subject').value;
      const book = document.getElementById('timer-book').value || '指定なし';
      const now = new Date();
      const dateStr = `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;

      const log = {
        id: Date.now(),
        date: dateStr,
        subject: subject,
        book: book,
        seconds: totalSecs
      };

      studyLogs.unshift(log);
      localStorage.setItem('agri_logs', JSON.stringify(studyLogs));

      alert(`【記録完了】\n${subject} - ${book}\n時間: ${Math.floor(totalSecs / 60)}分`);
      
      accumulatedTime = 0;
      startTime = null;
      localStorage.removeItem('agri_timer_state');
      updateTimerDisplay(0);
      updateWeeklyProgress();
    }

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && startTime) {
        updateTimerDisplay(getCurrentElapsedSeconds());
      }
    });

    function updateWeeklyProgress() {
      const totalSecs = studyLogs.reduce((acc, log) => acc + log.seconds, 0);
      const totalHrs = (totalSecs / 3600).toFixed(1);
      document.getElementById('weekly-goal').innerText = `累計学習: ${totalHrs} / 45時間`;
    }

    // --- Calculator Functions ---
    let calcVal = '0';
    function updateCalc() { document.getElementById('calc-screen').value = calcVal; }
    function calcNum(num) {
      if (calcVal === '0') calcVal = num;
      else calcVal += num;
      updateCalc();
    }
    function calcCmd(cmd) {
      if (cmd === 'C') calcVal = '0';
      else if (cmd === 'sin') calcVal = String(Math.sin(eval(calcVal) * Math.PI / 180));
      else if (cmd === 'cos') calcVal = String(Math.cos(eval(calcVal) * Math.PI / 180));
      else if (cmd === 'tan') calcVal = String(Math.tan(eval(calcVal) * Math.PI / 180));
      else if (cmd === 'sqrt') calcVal = String(Math.sqrt(eval(calcVal)));
      else if (cmd === 'log') calcVal = String(Math.log10(eval(calcVal)));
      else if (cmd === 'pi') calcVal = String(Math.PI);
      else calcVal += cmd;
      updateCalc();
    }
    function calcEqual() {
      try {
        calcVal = String(eval(calcVal.replace(/×/g, '*').replace(/÷/g, '/')));
      } catch (e) {
        calcVal = 'Error';
      }
      updateCalc();
    }

    // --- Books Management ---
    function addNewBook() {
      const subj = document.getElementById('new-book-subject').value;
      const title = document.getElementById('new-book-title').value.trim();
      if (!title) return alert('参考書名を入力してください。');
      
      if (!userBooks[subj]) userBooks[subj] = [];
      userBooks[subj].push(title);
      localStorage.setItem('agri_books', JSON.stringify(userBooks));
      
      document.getElementById('new-book-title').value = '';
      updateBookDropdown();
      renderBooksList();
      alert(`「${title}」を${subj}に追加しました！`);
    }

    function renderBooksList() {
      const container = document.getElementById('books-list');
      container.innerHTML = '';
      for (const [subj, books] of Object.entries(userBooks)) {
        const div = document.createElement('div');
        div.className = 'border-l-4 border-emerald-600 pl-3 space-y-1';
        div.innerHTML = `<h4 class="font-bold text-slate-800">${subj} (${books.length}冊)</h4>
          <p class="text-xs text-slate-600 leading-relaxed">${books.join(' / ')}</p>`;
        container.appendChild(div);
      }
    }

    // --- Logs Render ---
    function renderLogs() {
      const totalsDiv = document.getElementById('subject-totals');
      const totals = { 英語: 0, 数学: 0, 理科: 0, 国語: 0 };
      
      studyLogs.forEach(l => {
        if (totals[l.subject] !== undefined) totals[l.subject] += l.seconds;
      });

      totalsDiv.innerHTML = '';
      for (const [subj, secs] of Object.entries(totals)) {
        const hrs = (secs / 3600).toFixed(1);
        totalsDiv.innerHTML += `
          <div class="bg-slate-50 p-3 rounded-xl text-center border border-slate-200">
            <p class="text-xs font-bold text-slate-500">${subj}</p>
            <p class="text-lg font-extrabold text-emerald-700">${hrs} <span class="text-xs font-normal">時間</span></p>
          </div>`;
      }

      const logsContainer = document.getElementById('logs-list');
      logsContainer.innerHTML = studyLogs.length ? '' : '<p class="text-xs text-slate-400">学習記録がありません。</p>';
      studyLogs.forEach(l => {
        const mins = Math.floor(l.seconds / 60);
        logsContainer.innerHTML += `
          <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 flex justify-between items-center text-xs">
            <div>
              <span class="font-bold text-emerald-700 mr-2">[${l.subject}]</span>
              <span class="font-medium text-slate-700">${l.book}</span>
              <p class="text-slate-400 text-[10px] mt-0.5">${l.date}</p>
            </div>
            <span class="font-bold text-slate-800 text-sm">${mins}分</span>
          </div>`;
      });
    }

    // Initial load
    initCountdown();
    updateBookDropdown();
    updateWeeklyProgress();
  </script>
</body>
</html>
