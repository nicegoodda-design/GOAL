  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-20">
  <div id="root"></div>

  <script type="text/babel">

      { id: 'tb-eng-1', subjectId: 'english', name: 'Stock4500' },
      { id: 'tb-eng-2', subjectId: 'english', name: 'ランク順入試英熟語1100' },
      { id: 'tb-eng-3', subjectId: 'english', name: '速読英単語 上級編' },

      { id: 'tb-eng-5', subjectId: 'english', name: '大学入試世界一わかりやすい英文読解の特別講座' },
      { id: 'tb-eng-6', subjectId: 'english', name: '大学受験のための英文熟考 上' },
      { id: 'tb-eng-7', subjectId: 'english', name: '大学受験のための英文熟考 下' },
      { id: 'tb-eng-8', subjectId: 'english', name: 'やっておきたい英語長文300' },
      { id: 'tb-eng-9', subjectId: 'english', name: 'やっておきたい英語長文500' },
      { id: 'tb-eng-10', subjectId: 'english', name: '関正生のThe Rules 英語長文問題集1 入試基礎' },
      { id: 'tb-eng-11', subjectId: 'english', name: '関正生のThe Rules 英語長文問題集2 入試標準' },
      { id: 'tb-eng-12', subjectId: 'english', name: '関正生のThe Rules 英語長文問題集3 入試難関' },
      { id: 'tb-eng-13', subjectId: 'english', name: '関正生のThe Rules 英語長文問題集4 入試最難関' },
      { id: 'tb-eng-14', subjectId: 'english', name: '関正生の英語長文ポラリス1 標準レベル' },
      { id: 'tb-eng-15', subjectId: 'english', name: '関正生の英語長文ポラリス2 応用レベル' },
      { id: 'tb-eng-16', subjectId: 'english', name: '関正生の英語長文ポラリス3 発展レベル' },
      { id: 'tb-eng-17', subjectId: 'english', name: '英語長文問題精選ファイナル' },
      { id: 'tb-eng-18', subjectId: 'english', name: '国公立標準問題集CanPass 英語' },
      { id: 'tb-eng-19', subjectId: 'english', name: '大学入試英語長文プラス記述式トレーニング問題集' },
      { id: 'tb-eng-20', subjectId: 'english', name: '竹岡広信の英作文が面白いほど書ける本 決定版' },

      // 数学
      { id: 'tb-math-1', subjectId: 'math', name: '数学I・A 入門問題精講' },
      { id: 'tb-math-2', subjectId: 'math', name: '数学II・B 入門問題精講' },
      { id: 'tb-math-3', subjectId: 'math', name: '数学III・C 入門問題精講' },
      { id: 'tb-math-4', subjectId: 'math', name: 'Focus Gold 数学I+A' },
      { id: 'tb-math-5', subjectId: 'math', name: 'Focus Gold 数学II+B' },
      { id: 'tb-math-6', subjectId: 'math', name: 'Focus Gold 数学III' },
      { id: 'tb-math-7', subjectId: 'math', name: '1対1対応の演習／数学I' },
      { id: 'tb-math-8', subjectId: 'math', name: '1対1対応の演習／数学A' },
      { id: 'tb-math-9', subjectId: 'math', name: '1対1対応の演習／数学II' },
      { id: 'tb-math-10', subjectId: 'math', name: '1対1対応の演習／数学B' },
      { id: 'tb-math-11', subjectId: 'math', name: '1対1対応の演習／数学III 微積分編' },
      { id: 'tb-math-12', subjectId: 'math', name: '1対1対応の演習／数学III 曲線・複素数編' },
      { id: 'tb-math-13', subjectId: 'math', name: '数学I+A+II+B 上級問題精講' },
      { id: 'tb-math-14', subjectId: 'math', name: '数学III 上級問題精講' },

      // 化学
      { id: 'tb-chem-1', subjectId: 'chem', name: 'スクエア最新図説化学' },
      { id: 'tb-chem-2', subjectId: 'chem', name: '橋爪のゼロから劇的にわかる理論化学' },
      { id: 'tb-chem-3', subjectId: 'chem', name: '橋爪のゼロから劇的にわかる無機化学 有機化学' },
      { id: 'tb-chem-4', subjectId: 'chem', name: '化学の新標準演習' },
      { id: 'tb-chem-5', subjectId: 'chem', name: '鎌田の理論化学の講義' },
      { id: 'tb-chem-6', subjectId: 'chem', name: '福間の無機化学の講義' },
      { id: 'tb-chem-7', subjectId: 'chem', name: '鎌田の有機化学の講義' },
      { id: 'tb-chem-8', subjectId: 'chem', name: 'ここで差がつく有機化合物の構造決定問題の要点・演習' },
      { id: 'tb-chem-9', subjectId: 'chem', name: '化学重要問題集' },

      // 物理
      { id: 'tb-phys-1', subjectId: 'phys', name: 'スタサプ物理' },
      { id: 'tb-phys-2', subjectId: 'phys', name: '物理教室' },
      { id: 'tb-phys-3', subjectId: 'phys', name: '良問の風 物理頻出・標準入試問題集' },
      { id: 'tb-phys-4', subjectId: 'phys', name: '名問の森 物理［力学・熱・波動I］' },
      { id: 'tb-phys-5', subjectId: 'phys', name: '名問の森 物理［波動II・電磁気・原子］' },

      // 国語
      { id: 'tb-jp-1', subjectId: 'japanese', name: '読解を深める現代文単語 評論・小説' },
      { id: 'tb-jp-2', subjectId: 'japanese', name: 'マドンナ古文常識' },
      { id: 'tb-jp-3', subjectId: 'japanese', name: '古文単語グループ600' },
      { id: 'tb-jp-4', subjectId: 'japanese', name: '船口のゼロから読み解く最強の現代文' },
      { id: 'tb-jp-5', subjectId: 'japanese', name: '船口の記述トレーニング' },
      { id: 'tb-jp-6', subjectId: 'japanese', name: '現代文基礎問題精講' },
      { id: 'tb-jp-7', subjectId: 'japanese', name: '入試現代文へのアクセス 基本編' },
      { id: 'tb-jp-8', subjectId: 'japanese', name: '入試現代文へのアクセス 発展編' },
      { id: 'tb-jp-9', subjectId: 'japanese', name: '現代文読解力の開発講座' },
      { id: 'tb-jp-10', subjectId: 'japanese', name: '現代文と格闘する' },
      { id: 'tb-jp-11', subjectId: 'japanese', name: '八澤のたった6時間で古典文法' },
      { id: 'tb-jp-12', subjectId: 'japanese', name: '八澤のたった3時間で古文読解' },
      { id: 'tb-jp-13', subjectId: 'japanese', name: '古文上達 基礎編 読解と演習45 文法理解から応用まで' },
      { id: 'tb-jp-14', subjectId: 'japanese', name: '漢文早覚え速答法' },
      { id: 'tb-jp-15', subjectId: 'japanese', name: '国公立標準問題集CanPass古典' },
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [logs, setLogs] = useState(() => {
        try {
          const saved = localStorage.getItem('agri_pass_logs');
          return saved ? JSON.parse(saved) : [];
        } catch (e) { return []; }
      });
      const [textbooks, setTextbooks] = useState(() => {
        try {
          const saved = localStorage.getItem('agri_pass_textbooks');
          return saved ? JSON.parse(saved) : DEFAULT_TEXTBOOKS;
        } catch (e) { return DEFAULT_TEXTBOOKS; }
      });

      useEffect(() => {
        try { localStorage.setItem('agri_pass_logs', JSON.stringify(logs)); } catch (e) {}
      }, [logs]);

      useEffect(() => {
        try { localStorage.setItem('agri_pass_textbooks', JSON.stringify(textbooks)); } catch (e) {}
      }, [textbooks]);

      const daysUntilExam = useMemo(() => {
        const target = new Date(TARGET_EXAM_DATE);
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        return Math.ceil((target - today) / (1000 * 60 * 60 * 24));
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800">
          <header className="bg-[#1B4332] text-white p-4 shadow-md flex justify-between items-center">
            <div>
              <h1 className="font-bold text-lg">AgriPass</h1>
              <p className="text-xs text-emerald-200">京大農学部合格特化アプリ</p>
            </div>
            <div className="text-right">
              <span className="text-xs bg-emerald-700 px-2.5 py-1 rounded-full font-bold">
                京大二次まで あと {daysUntilExam} 日
              </span>
            </div>
          </header>

          <main className="max-w-2xl mx-auto p-4">
            {activeTab === 'dashboard' && <DashboardTab logs={logs} setLogs={setLogs} setActiveTab={setActiveTab} />}
            {activeTab === 'timer' && <TimerTab logs={logs} setLogs={setLogs} textbooks={textbooks} setTextbooks={setTextbooks} />}
            {activeTab === 'analytics' && <AnalyticsTab logs={logs} textbooks={textbooks} setTextbooks={setTextbooks} />}
          </main>

          <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-2 flex justify-around shadow-lg">
            <button onClick={() => setActiveTab('dashboard')} className={`p-2 text-xs font-bold ${activeTab === 'dashboard' ? 'text-[#1B4332]' : 'text-slate-400'}`}>ホーム</button>
            <button onClick={() => setActiveTab('timer')} className={`p-2 text-xs font-bold ${activeTab === 'timer' ? 'text-[#1B4332]' : 'text-slate-400'}`}>タイマー</button>
            <button onClick={() => setActiveTab('analytics')} className={`p-2 text-xs font-bold ${activeTab === 'analytics' ? 'text-[#1B4332]' : 'text-slate-400'}`}>参考書・分析</button>
          </nav>
        </div>
      );
    }

    function DashboardTab({ logs, setLogs, setActiveTab }) {
      const weeklyHours = useMemo(() => {
        const sevenDaysAgo = new Date();
        sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
        const recentLogs = logs.filter(log => new Date(log.date) >= sevenDaysAgo);
        return (recentLogs.reduce((acc, log) => acc + (log.durationMinutes || 0), 0) / 60).toFixed(1);
      }, [logs]);

      return (
        <div className="space-y-4">
          <div className="bg-[#1B4332] text-white rounded-2xl p-5 shadow">
            <div className="text-xs text-emerald-200">今週の学習時間</div>
            <div className="text-3xl font-black mt-1">{weeklyHours} / {WEEKLY_GOAL_HOURS} 時間</div>
          </div>

          <div className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-3">
            <h2 className="font-bold text-slate-800 text-sm">学習ログ ({logs.length}件)</h2>
            {logs.length === 0 ? (
              <p className="text-xs text-slate-400 py-4 text-center">まだ記録がありません。「タイマー」から計測してみましょう！</p>
            ) : (
              logs.map(log => (
                <div key={log.id} className="p-3 bg-slate-50 rounded-xl border border-slate-200 flex justify-between items-center text-xs">
                  <div>
                    <div className="font-bold text-slate-800">{log.textBook}</div>
                    <div className="text-slate-400">{log.date}</div>
                  </div>
                  <div className="font-black text-[#1B4332] text-sm">{log.durationMinutes}分</div>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    function TimerTab({ logs, setLogs, textbooks, setTextbooks }) {
      const [seconds, setSeconds] = useState(0);
      const [isActive, setIsActive] = useState(false);
      const [selectedSubject, setSelectedSubject] = useState('math');
      const [selectedTbId, setSelectedTbId] = useState('');
      const timerRef = useRef(null);

      const availableTb = useMemo(() => textbooks.filter(tb => tb.subjectId === selectedSubject), [textbooks, selectedSubject]);

      useEffect(() => {
        if (availableTb.length > 0) setSelectedTbId(availableTb[0].id);
      }, [selectedSubject, availableTb]);

      useEffect(() => {
        if (isActive) {
          timerRef.current = setInterval(() => setSeconds(s => s + 1), 1000);
        } else {
          clearInterval(timerRef.current);
        }
        return () => clearInterval(timerRef.current);
      }, [isActive]);

      const handleSave = () => {
        const mins = Math.max(1, Math.round(seconds / 60));
        const tbObj = textbooks.find(t => t.id === selectedTbId);
        const newLog = {
          id: 'log_' + Date.now(),
          date: new Date().toISOString().split('T')[0],
          subjectId: selectedSubject,
          textBook: tbObj ? tbObj.name : '自主学習',
          durationMinutes: mins
        };
        const nextLogs = [newLog, ...logs];
        setLogs(nextLogs);
        localStorage.setItem('agri_pass_logs', JSON.stringify(nextLogs));
        setIsActive(false);
        setSeconds(0);
        alert('記録を保存しました！');
      };

      const formatTime = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

      return (
        <div className="space-y-4">
          <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
            <label className="block text-xs font-bold text-slate-600">教科と参考書を選択</label>
            <select value={selectedSubject} onChange={e => setSelectedSubject(e.target.value)} className="w-full text-xs p-2.5 rounded-xl border border-slate-300">
              {DEFAULT_SUBJECTS.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
            <select value={selectedTbId} onChange={e => setSelectedTbId(e.target.value)} className="w-full text-xs p-2.5 rounded-xl border border-slate-300">
              {availableTb.map(tb => <option key={tb.id} value={tb.id}>{tb.name}</option>)}
            </select>
          </div>

          <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm text-center space-y-6">
            <div className="text-6xl font-mono font-bold text-slate-800">{formatTime(seconds)}</div>
            <div className="flex justify-center space-x-3">
              {!isActive ? (
                <button onClick={() => setIsActive(true)} className="bg-[#1B4332] text-white font-bold px-6 py-3 rounded-xl">スタート</button>
              ) : (
                <button onClick={() => setIsActive(false)} className="bg-amber-500 text-white font-bold px-6 py-3 rounded-xl">一時停止</button>
              )}
              <button onClick={handleSave} className="bg-emerald-600 text-white font-bold px-6 py-3 rounded-xl">そのまま記録する</button>
            </div>
          </div>
        </div>
      );
    }

    function AnalyticsTab({ logs, textbooks, setTextbooks }) {
      const [newTbName, setNewTbName] = useState('');
      const [newSubId, setNewSubId] = useState('math');

      const handleAdd = (e) => {
        e.preventDefault();
        if (!newTbName.trim()) return;
        const newTb = { id: 'tb_' + Date.now(), subjectId: newSubId, name: newTbName.trim() };
        const nextTb = [...textbooks, newTb];
        setTextbooks(nextTb);
        localStorage.setItem('agri_pass_textbooks', JSON.stringify(nextTb));
        setNewTbName('');
        alert('参考書を追加しました！');
      };

      return (
        <div className="space-y-4">
          <form onSubmit={handleAdd} className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-2">
            <h3 className="font-bold text-xs text-slate-700">参考書を新しく追加</h3>
            <select value={newSubId} onChange={e => setNewSubId(e.target.value)} className="w-full text-xs p-2 rounded-xl border border-slate-300">
              {DEFAULT_SUBJECTS.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
            <input type="text" value={newTbName} onChange={e => setNewTbName(e.target.value)} placeholder="参考書名" className="w-full text-xs p-2 rounded-xl border border-slate-300" />
            <button type="submit" className="w-full bg-[#1B4332] text-white font-bold text-xs p-2.5 rounded-xl">追加</button>
          </form>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
